<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>typst2web</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f4;
      --page-bg: #fff;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --page-bg: #fff;
        --shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px 16px;
    }
    main {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .page {
      background: var(--page-bg);
      box-shadow: var(--shadow);
      border-radius: 4px;
      overflow: hidden;
      display: block;
    }
    .page svg, .page img {
      display: block;
      width: 100%;
      height: auto;
    }
    .status {
      text-align: center;
      color: #888;
      padding: 40px 16px;
    }
  </style>
</head>
<body>
  <main id="doc">
    <p class="status">Loading…</p>
  </main>
  <script>
    (async () => {
      const root = document.getElementById('doc');
      try {
        const res = await fetch('pages.json', { cache: 'no-cache' });
        if (!res.ok) throw new Error('pages.json: ' + res.status);
        const { pages } = await res.json();
        if (!Array.isArray(pages) || pages.length === 0) {
          root.innerHTML = '<p class="status">No pages were generated.</p>';
          return;
        }
        root.innerHTML = '';
        for (const name of pages) {
          const wrap = document.createElement('div');
          wrap.className = 'page';
          const img = document.createElement('img');
          img.src = name;
          img.alt = name;
          img.loading = 'lazy';
          wrap.appendChild(img);
          root.appendChild(wrap);
        }
      } catch (err) {
        root.innerHTML = '<p class="status">Failed to load document: ' + err.message + '</p>';
      }
    })();
  </script>
</body>
</html>
